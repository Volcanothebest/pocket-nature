<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="口袋自然 Pocket Nature：给去不了远方的人，一段随身的自然声音疗愈。">
<meta name="theme-color" content="#121A1C">
<title>口袋自然</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@300;500;700&family=Source+Serif+4:ital,wght@0,300;0,400;1,400&display=swap">
<style>
/* Layout: one screen, one window. A real landscape photo (or the painted fallback) fills the view; a round frosted "lens" at the centre is the only big object — tap it to begin. Scenes sit in a thin glass strip below; everything else lives in a side drawer. Four type sizes: s 13 / m 15 / l 20 / xl display. */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --ink:#FFF7EC; --ink-2:rgba(255,247,236,.78); --ink-3:rgba(255,247,236,.56);
  --glass:rgba(255,248,238,.10); --glass-2:rgba(255,248,238,.18); --line:rgba(255,248,238,.26);
  --sheet:rgba(24,29,26,.72); --amber:#F2B47A; --amber-ink:#2A1C10; --night:#121A1C;
  --fs-s:13px; --fs-m:15px; --fs-l:20px; --fs-xl:clamp(30px,5vw,40px);
  --f-serif:"Noto Serif SC","Source Serif 4","Songti SC",serif;
  --f-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-latin:"Source Serif 4",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
html{background:var(--night)}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-sans);font-size:var(--fs-m);line-height:1.7;text-shadow:0 1px 14px rgba(0,0,0,.25);overflow:hidden}
h1,h2,h3{font-family:var(--f-serif);font-weight:500;margin:0;line-height:1.4;text-wrap:balance}
p,li,summary,.small,.q-main,.q-sub,.q-cite,.lens-top,.hint,.msg,.care,.guide,label,.validate{text-wrap:pretty}
.lens-sub,.hint,.endcard .msg,.daily .q-main,.daily .q-sub,.daily .q-cite,.wx-now b{text-wrap:balance}
h2{font-size:var(--fs-l);letter-spacing:.06em}
h3{font-size:var(--fs-m)}
p{margin:0}
.bg{position:fixed;inset:-4%;background:center/cover no-repeat;opacity:0;transition:opacity 1.6s ease;z-index:0;animation:drift 48s ease-in-out infinite alternate}
.bg.on{opacity:1}
.scrim{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,rgba(10,14,12,0) 40%,rgba(10,14,12,.38)),linear-gradient(rgba(10,14,12,.32),rgba(10,14,12,.04) 26%,rgba(10,14,12,.04) 56%,rgba(10,14,12,.52))}
.bg::after{content:"";position:absolute;inset:0;background:rgba(242,180,122,.06);mix-blend-mode:soft-light}
.credit{position:fixed;right:20px;top:calc(68px + env(safe-area-inset-top,0px));text-align:right;padding:2px 10px;border-radius:999px;background:rgba(18,24,21,.32);z-index:4;font-size:var(--fs-s);color:var(--ink-2);pointer-events:none}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.07) translate(-1%,-.5%)}}
#field{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:1}
#touch{position:fixed;inset:0;z-index:2;cursor:crosshair;touch-action:none;outline:none}
button{font:inherit;font-size:var(--fs-m);color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:7px 16px;min-height:40px;cursor:pointer;transition:background .3s,border-color .3s,transform .2s;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
button:hover{background:var(--glass-2)}
button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
button[aria-pressed="true"]{background:rgba(242,180,122,.9);color:var(--amber-ink);border-color:rgba(255,222,184,.9);text-shadow:none}
.primary{background:rgba(242,180,122,.92);color:var(--amber-ink);border-color:rgba(255,222,184,.9);font-weight:500;text-shadow:none}
.primary:hover{background:var(--amber)}
.link{background:none;border:none;padding:4px 0;min-height:auto;color:var(--ink-2);text-decoration:underline;text-underline-offset:4px;-webkit-backdrop-filter:none;backdrop-filter:none}
.small{font-size:var(--fs-s);color:var(--ink-2)}
.glass{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(22px) saturate(1.15);backdrop-filter:blur(22px) saturate(1.15);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 18px 50px rgba(0,0,0,.16)}

/* ---- the one screen ---- */
.ui{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(18px + env(safe-area-inset-bottom,0px));pointer-events:none}
@media (min-width:720px){.ui{padding-inline:40px}}
.ui > *{pointer-events:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.brand b{font-family:var(--f-serif);font-weight:500;letter-spacing:.24em}
.brand span{font-size:var(--fs-s);color:var(--ink-2)}
@media (max-width:520px){.brand span{display:none}}
@media (min-width:720px){.credit{right:40px}}
.tools{display:flex;gap:8px;align-items:center}
.lang{display:inline-flex;border-radius:999px;padding:3px}
.lang button{border:none;min-height:32px;padding:2px 12px;font-size:var(--fs-s);background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.lang button[aria-pressed="true"]{background:rgba(255,248,238,.9)}
.icon-btn{width:40px;height:40px;padding:0;display:grid;place-items:center}
.checkin{align-self:center;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:center;border-radius:20px;padding:8px 14px;margin-top:14px;font-size:var(--fs-s)}
.checkin .chips button{min-height:32px;padding:2px 12px;font-size:var(--fs-s)}
.middle{flex:1;display:grid;place-items:center;position:relative;pointer-events:none;min-height:0}
.hint{position:absolute;left:0;right:0;top:6%;text-align:center;font-family:var(--f-serif);font-weight:300;font-size:var(--fs-l);transition:opacity .8s;padding-inline:12px}
.lens{pointer-events:auto;width:min(68vw,320px);aspect-ratio:1;max-width:100%;border-radius:50%;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;
  background:radial-gradient(circle at 50% 30%,rgba(255,250,242,.16),rgba(18,24,21,.2) 60%,rgba(18,24,21,.32));border:1px solid rgba(255,248,238,.42);
  -webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);box-shadow:inset 0 1px 1px rgba(255,255,255,.35),inset 0 -20px 40px rgba(0,0,0,.08),0 30px 80px rgba(0,0,0,.2);transition:transform 1.2s ease,box-shadow .6s}
.lens:hover{background:radial-gradient(circle at 50% 35%,rgba(255,250,242,.26),rgba(255,248,238,.08) 62%,rgba(255,248,238,.14))}
.lens.breathing{box-shadow:inset 0 1px 1px rgba(255,255,255,.35),0 0 90px rgba(255,190,130,.35)}
.lens-top{font-size:var(--fs-s);letter-spacing:.22em;color:var(--ink-2)}
.lens-main{font-family:var(--f-serif);font-weight:700;font-size:var(--fs-xl);letter-spacing:.14em;line-height:1.25}
html[lang="en"] .lens-main{font-family:var(--f-latin);font-weight:600;letter-spacing:.02em}
.lens-main.time{font-family:var(--f-mono);font-weight:400;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.lens-sub{font-size:var(--fs-s);color:var(--ink-2);max-width:17em;text-wrap:balance}
.lens-cta{margin-top:8px;font-size:var(--fs-s);letter-spacing:.14em;padding:4px 16px;border-radius:999px;background:rgba(242,180,122,.92);color:var(--amber-ink);text-shadow:none;animation:pulse 10s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.78}40%{opacity:1}}
.playbar{align-self:center;display:flex;gap:8px;border-radius:999px;padding:5px;margin-top:6px}
.playbar button{min-height:36px}
.scenes{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px;margin-top:10px;scrollbar-width:none;justify-content:safe center}
.scenes::-webkit-scrollbar{display:none}
.tile{flex:0 0 auto;scroll-snap-align:center;display:flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;border-radius:999px;font-size:var(--fs-s);font-weight:700;white-space:nowrap}
.tile .th{width:30px;height:30px;border-radius:50%;background:center/cover no-repeat;position:relative;flex:none;border:1px solid var(--line)}
.tile .rec{position:absolute;right:-2px;top:-2px;width:9px;height:9px;border-radius:50%;background:var(--amber);border:1.5px solid var(--night)}
.daily{align-self:center;text-align:center;max-width:560px;margin-top:12px;display:flex;flex-direction:column;gap:2px}
.daily .q-sub{display:none}
@media (min-height:760px){.daily .q-sub{display:block}}
body.playing .scenes,body.playing .daily,body.playing .checkin{opacity:0;pointer-events:none;transition:opacity .8s}
.q-main{font-family:var(--f-serif);font-size:var(--fs-m);line-height:1.7}
.q-sub{font-family:var(--f-latin);font-size:var(--fs-s);color:var(--ink-2);font-style:italic}
.q-cite{font-size:var(--fs-s);color:var(--ink-3)}
.endcard{position:fixed;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(10,14,12,.2)}
.endcard .card{border-radius:30px;padding:30px;max-width:500px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:16px;text-align:center;align-items:center;background:var(--sheet);border:1px solid var(--line);-webkit-backdrop-filter:blur(28px);backdrop-filter:blur(28px)}
.endcard .msg{font-family:var(--f-serif);font-size:var(--fs-l);line-height:1.7}
.endcard .q-main{font-size:var(--fs-m)}
.eyebrow{font-size:var(--fs-s);letter-spacing:.24em;color:var(--ink-2)}
.wxrow{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.wxrow span{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--glass-2);border:1px solid var(--line)}
.care{background:rgba(242,180,122,.14);border:1px solid rgba(242,180,122,.5);border-radius:16px;padding:10px 14px;font-size:var(--fs-s);text-align:left}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

/* ---- drawer ---- */
.drawer{position:fixed;inset:0;z-index:18;display:flex;justify-content:flex-end;background:rgba(10,14,12,.25)}
.drawer-in{width:min(560px,100%);height:100%;background:var(--sheet);border-left:1px solid var(--line);-webkit-backdrop-filter:blur(30px) saturate(1.2);backdrop-filter:blur(30px) saturate(1.2);display:flex;flex-direction:column}
.drawer-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 22px 12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:0 22px 14px;border-bottom:1px solid var(--line)}
.tabs button{min-height:34px;padding:2px 14px;font-size:var(--fs-s)}
.panes{flex:1;overflow:auto;padding:22px 22px calc(28px + env(safe-area-inset-bottom,0px))}
.pane{display:flex;flex-direction:column;gap:22px}
.group{display:flex;flex-direction:column;gap:10px}
.label{font-size:var(--fs-s);color:var(--ink-2);letter-spacing:.14em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.mixer{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.snd{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.snd.on{background:rgba(242,180,122,.13);border-color:rgba(242,180,122,.55)}
.snd header{display:flex;align-items:center;gap:12px}
.glyph{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-serif);background:var(--glass-2);border:1px solid var(--line);flex:none}
.snd.on .glyph{background:var(--amber);color:var(--amber-ink);border-color:transparent;text-shadow:none}
.snd-t{min-width:0}
.land{font-size:var(--fs-s);color:var(--ink-2)}
.sw{margin-left:auto;min-width:54px;min-height:32px;padding:2px 12px;font-size:var(--fs-s)}
input[type=range]{width:100%;accent-color:var(--amber);margin:0}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:2px 10px}
.steps li::before{content:"0" counter(s);font-family:var(--f-mono);font-size:var(--fs-s);color:var(--amber);grid-row:span 2;padding-top:2px}
.steps p{font-size:var(--fs-s);color:var(--ink-2)}
.guide{border-left:2px solid var(--amber);padding-left:14px;font-size:var(--fs-s);color:var(--ink-2)}
.evs{display:flex;flex-direction:column;gap:10px}
.ev{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px}
.ev-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grade{font-family:var(--f-mono);font-size:var(--fs-s);border-radius:6px;padding:0 7px;border:1px solid var(--line);color:var(--ink-2);text-shadow:none}
.grade.A{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.grade.B{background:rgba(242,180,122,.28);color:var(--ink)}
.ev-use{font-size:var(--fs-s);color:var(--amber)}
.ev p{font-size:var(--fs-s)}
.ev .cite{font-family:var(--f-mono);color:var(--ink-3);overflow-wrap:anywhere}
.photos{display:flex;flex-direction:column;gap:8px}
.ph{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:8px 12px}
.ph .th{width:44px;height:44px;border-radius:12px;background:center/cover no-repeat;flex:none}
.ph .nm{flex:1;min-width:0}
.ph label{font-size:var(--fs-s);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;background:var(--glass)}
.ph input{position:absolute;width:1px;height:1px;opacity:0}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:18px;padding:14px 16px}
details summary{cursor:pointer;color:var(--ink-2);font-size:var(--fs-s)}
pre.json{font-family:var(--f-mono);font-size:var(--fs-s);background:rgba(0,0,0,.25);border-radius:12px;padding:10px;overflow:auto;max-height:200px;margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;text-shadow:none}

/* ---- check-in sheets ---- */
.modal{position:fixed;inset:0;background:rgba(10,14,12,.3);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.sheet{background:var(--sheet);border:1px solid var(--line);-webkit-backdrop-filter:blur(30px) saturate(1.2);backdrop-filter:blur(30px) saturate(1.2);border-radius:30px;width:100%;max-width:520px;max-height:min(88vh,760px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.sheet-body{padding:28px 26px 10px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.sheet-foot{padding:14px 26px 22px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.sheet h2{font-size:var(--fs-l)}
.sheet h3{margin-top:6px}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:3px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--amber)}
.bubbles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding-block:4px}
.bubble{min-height:46px;padding:8px 20px}
.validate{background:rgba(242,180,122,.11);border:1px solid rgba(242,180,122,.32);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.wx{display:flex;flex-direction:column;gap:10px;padding-block:4px}
.wx-now{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--amber);min-height:40px}
.wx-now b{font-family:var(--f-serif);font-weight:500;font-size:var(--fs-l);color:var(--ink)}
.wx-track{position:relative;padding-block:16px 6px}
.ghost{position:absolute;top:-8px;transform:translateX(-50%);color:var(--ink-2);opacity:.75;pointer-events:none}
.wx-ends{display:flex;justify-content:space-between;font-size:var(--fs-s);color:var(--ink-2)}
.body-part{display:flex;flex-direction:column;gap:6px}
.body-part b{font-size:var(--fs-s);color:var(--ink-2);font-weight:400}
.warn{color:var(--amber);font-size:var(--fs-s);min-height:1.4em}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<div class="bg" id="bgA"></div><div class="bg" id="bgB"></div>
<div class="scrim" aria-hidden="true"></div>
<canvas id="field" aria-hidden="true"></canvas>
<div id="touch" tabindex="0" aria-label="Nature canvas — tap to make sound, drag to rustle"></div>

<div class="ui">
  <header class="top">
    <div class="brand"><b data-i="brand"></b><span data-i="tagline"></span></div>
    <div class="tools">
      <div class="lang glass" role="group" aria-label="Language">
        <button type="button" id="langZh" aria-pressed="true">中</button>
        <button type="button" id="langEn" aria-pressed="false">EN</button>
      </div>
      <button type="button" class="icon-btn glass" id="openDrawer" aria-label="Sounds, practice, evidence, privacy"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h13"/></svg></button>
    </div>
  </header>

  <div class="checkin glass" id="checkin" hidden>
    <span data-i="checkQ"></span>
    <span class="chips" id="checkOpts">
      <button type="button" data-v="kept" data-i="checkKept"></button>
      <button type="button" data-v="half" data-i="checkHalf"></button>
      <button type="button" data-v="no" data-i="checkNo"></button>
    </span>
  </div>

  <div class="middle">
    <p class="hint" id="hint" hidden></p>
    <button type="button" class="lens" id="lens">
      <span class="lens-top" id="lensTop"></span>
      <span class="lens-main" id="lensMain"></span>
      <span class="lens-sub" id="lensSub"></span>
      <span class="lens-cta" id="lensCta"></span>
    </button>
  </div>

  <div class="playbar glass" id="playbar" hidden>
    <button type="button" id="breathTgl" aria-pressed="false" data-i="orbBreath"></button>
    <button type="button" id="finishBtn" data-i="finish"></button>
    <span id="nowPlaying" hidden></span>
  </div>

  <div class="scenes" id="scenes" role="group" aria-label="Scenes"></div>
  <div class="daily" id="daily"></div>
</div>

<div class="endcard" id="endcard" hidden></div>
<p class="credit" id="credit" data-i="aiCredit" hidden></p>

<div class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-label="Settings">
  <div class="drawer-in">
    <div class="drawer-head"><h2 data-i="brand"></h2><button type="button" class="icon-btn" id="closeDrawer" aria-label="Close"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="tabs" id="tabs">
      <button type="button" data-tab="sound" aria-pressed="true" data-i="tabSound"></button>
      <button type="button" data-tab="practice" aria-pressed="false" data-i="tabPractice"></button>
      <button type="button" data-tab="ev" aria-pressed="false" data-i="tabEv"></button>
      <button type="button" data-tab="privacy" aria-pressed="false" data-i="tabPrivacy"></button>
    </div>
    <div class="panes">
      <div class="pane" data-pane="sound">
        <div class="group"><span class="label" data-i="lenLabel"></span><div class="chips" id="durChips"></div></div>
        <div class="group"><span class="label" data-i="voiceLabel"></span><div class="chips" id="voiceChips"></div></div>
        <div class="group"><span class="label" data-i="mixerH"></span><div class="mixer" id="mixer"></div></div>
      </div>
      <div class="pane" data-pane="practice" hidden>
        <h2 data-i="practiceH"></h2>
        <ol class="steps">
          <li><h3 data-i="ps1t"></h3><p data-i="ps1d"></p></li>
          <li><h3 data-i="ps2t"></h3><p data-i="ps2d"></p></li>
          <li><h3 data-i="ps3t"></h3><p data-i="ps3d"></p></li>
          <li><h3 data-i="ps4t"></h3><p data-i="ps4d"></p></li>
          <li><h3 data-i="ps5t"></h3><p data-i="ps5d"></p></li>
        </ol>
      </div>
      <div class="pane" data-pane="ev" hidden>
        <p class="guide" data-i="evGuide"></p>

const TONE = [{zh:'宫',en:'gong'},{zh:'商',en:'shang'},{zh:'角',en:'jue'},{zh:'徵',en:'zhi'},{zh:'羽',en:'yu'}];
const PENTA = [0,2,4,7,9];

/* ---------- state ---------- */
const state = {levels:{}, last:{}, duration:300, remaining:300, elapsed:0, playing:false, started:false, breath:false, voice:'drop',
  scene:null, rec:null, pre:null, dim:false, hintKey:'hintStart', endModel:null, emoRec:null};
SOUNDS.forEach(s => { state.levels[s.id] = 0; state.last[s.id] = .5; });
const todayStr = d => { d = d || new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const dayKey = 'pn-min-' + todayStr();
let todaySec = Number(LS.get(dayKey, 0)) || 0, lastSave = todaySec;

/* ---------- audio engine ---------- */
let ctx = null, master, comp, analyser, freqData, touchBus, touchGain, touchFilter;
const voices = {}, NB = {};
let waveB = 0, breathT0 = 0;
function buildNoise(kind){
  const len = Math.floor(ctx.sampleRate * 5), fade = Math.floor(ctx.sampleRate * .08), tmp = new Float32Array(len + fade);
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0,last=0;
  for (let i = 0; i < tmp.length; i++){
    const w = Math.random()*2 - 1;
    if (kind === 'white') tmp[i] = w * .5;
    else if (kind === 'pink'){ b0=.99886*b0+w*.0555179; b1=.99332*b1+w*.0750759; b2=.969*b2+w*.153852; b3=.8665*b3+w*.3104856; b4=.55*b4+w*.5329522; b5=-.7616*b5-w*.016898; tmp[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11; b6=w*.115926; }
    else { last = (last + .02*w) / 1.02; tmp[i] = last * 3.5; }
  }
  const buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = tmp[i + fade];
  for (let i = 0; i < fade; i++){ const a = i / fade; d[len-fade+i] = tmp[len+i]*(1-a) + tmp[i]*a; }
  return buf;
}
const gn = v => { const g = ctx.createGain(); g.gain.value = v; return g; };
const filt = (type, f, q=.7) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; };
const pan = v => { if (ctx.createStereoPanner){ const p = ctx.createStereoPanner(); p.pan.value = v; return p; } return gn(1); };
const chain = (...n) => { for (let i = 0; i < n.length-1; i++) n[i].connect(n[i+1]); return n[n.length-1]; };
const rnd = (a, b) => a + Math.random()*(b-a);
const setP = (param, v, tc=.15) => param.setTargetAtTime(v, ctx.currentTime, tc);
function src(kind){ const s = ctx.createBufferSource(); s.buffer = NB[kind]; s.loop = true; s.start(0, Math.random()*4); return s; }
function burst(out, t0, dur, type, f, q, peak){
  const s = ctx.createBufferSource(); s.buffer = NB.white; const g = gn(0);
  chain(s, filt(type, f, q), g, pan(rnd(-.8,.8)), out);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(peak, t0+.002); g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
  s.start(t0, Math.random()*4); s.stop(t0+dur+.05);
}
function tone(out, t0, f0, f1, dur, peak, pv){
  const o = ctx.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0+dur);
  const g = gn(0); chain(o, g, pan(pv ?? rnd(-.7,.7)), out);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(peak, t0+Math.min(.01, dur*.2)); g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
  o.start(t0); o.stop(t0+dur+.05);
}
const pluckCache = {};
function pluck(out, t0, f, peak, pv){
  const key = Math.round(f);
  let buf = pluckCache[key];
  if (!buf){
    const sr = ctx.sampleRate, N = Math.floor(sr * 2.4), P = Math.max(2, Math.round(sr / f));
    buf = ctx.createBuffer(1, N, sr); const d = buf.getChannelData(0), ring = new Float32Array(P);
    let prev = 0; for (let i = 0; i < P; i++){ const w = Math.random()*2 - 1; prev = prev*.5 + w*.5; ring[i] = prev; }
    let idx = 0;
    for (let i = 0; i < N; i++){ const a = ring[idx], b = ring[(idx+1) % P]; ring[idx] = .4975*(a+b); d[i] = a; idx = (idx+1) % P; }
    pluckCache[key] = buf;
  }
  const s = ctx.createBufferSource(); s.buffer = buf;
  s.playbackRate.setValueAtTime(1, t0); s.playbackRate.linearRampToValueAtTime(1.012, t0+.35); s.playbackRate.linearRampToValueAtTime(1, t0+.8);
  const g = gn(peak); chain(s, filt('lowpass', 3800, .5), g, pan(pv), out);
  g.gain.setValueAtTime(peak, t0); g.gain.exponentialRampToValueAtTime(.0001, t0+2.3);
  s.start(t0); s.stop(t0+2.4);
}
function birdPhrase(out, t0, peak){
  const k = Math.random(), pv = rnd(-.7,.7);
  if (k < .4){ const f = rnd(3000,4500), n = 4 + Math.floor(Math.random()*6); for (let i=0;i<n;i++) tone(out, t0+i*.07, f, f*.8, .05, peak, pv); }
  else if (k < .75){ let tt = t0; const n = 2 + Math.floor(Math.random()*4); for (let i=0;i<n;i++){ const f = rnd(2200,4800), d = rnd(.08,.22); tone(out, tt, f, f*rnd(.7,1.4), d, peak, pv); tt += d + rnd(.04,.14); } }
  else { const f = rnd(1800,2600); tone(out, t0, f, f*1.8, .35, peak*.8, pv); tone(out, t0+.45, f*1.6, f, .4, peak*.8, pv); }
}
const BUILD = {
  rain(out){ chain(src('pink'), filt('highpass',500), filt('lowpass',7000), gn(.55), out);
    return {rate:16, event:t0 => burst(out, t0, rnd(.02,.07), 'bandpass', rnd(1500,6000), 3, rnd(.1,.45))}; },
  stream(out){ chain(src('brown'), filt('bandpass',650,.6), gn(1.3), out); const hf = filt('bandpass',1800,1.2); chain(src('pink'), hf, gn(.22), out);
    return {rate:7, event:t0 => { const f = rnd(350,1150); tone(out, t0, f, f*rnd(1.4,1.9), rnd(.05,.11), rnd(.04,.1)); }, update:x => setP(hf.frequency, 1500 + 500*Math.sin(x*.7) + 300*Math.sin(x*1.9), .2)}; },
  waves(out){ const lp = filt('lowpass',600,.5), g = gn(.4); chain(src('brown'), lp, g, out); const fg = gn(0); chain(src('white'), filt('highpass',2500), fg, out);
    return {update:() => { const b = waveB; setP(lp.frequency, 250 + 1600*b, .12); setP(g.gain, .2 + 1.0*b, .12); setP(fg.gain, .22*b*b*b, .12); }}; },
  snow(out){ chain(src('brown'), filt('lowpass',260,.5), gn(1.0), out); const hg = gn(.015); chain(src('white'), filt('highpass',6500), hg, out);
    return {rate:1.1, event:t0 => { const f = rnd(2400,4600); tone(out, t0, f, f*.98, rnd(.5,.9), rnd(.008,.018)); }, update:x => setP(hg.gain, .01 + .012*(.5+.5*Math.sin(x*.3)), .5)}; },
  leaves(out){ const g1 = gn(.3), g2 = gn(.2); chain(src('white'), filt('bandpass',3200,.7), g1, out); chain(src('pink'), filt('bandpass',900,.6), g2, out); let gust = .4, tgt = .4;
    return {rate:10, event:t0 => burst(out, t0, rnd(.008,.028), 'bandpass', rnd(4000,7000), 2, .04*gust + .02), update:() => { if (Math.random() < .02) tgt = rnd(.15,1); gust += (tgt-gust)*.03; setP(g1.gain, .08 + .45*gust, .25); setP(g2.gain, .05 + .25*gust, .25); }}; },
  wind(out){ const bp = filt('bandpass',500,1.6), g = gn(.5); chain(src('pink'), bp, g, out); chain(src('brown'), filt('lowpass',180), gn(.5), out);
    return {update:x => { const s = .5 + .3*Math.sin(x*.21) + .2*Math.sin(x*.53+1); setP(bp.frequency, 260 + 650*s, .3); setP(g.gain, .25 + .9*s, .3); }}; },
  fire(out){ chain(src('brown'), filt('lowpass',320), gn(.7), out); chain(src('pink'), filt('bandpass',1300,.5), gn(.05), out);
    return {rate:6, event:t0 => { const n = Math.random() < .25 ? 3 : 1; for (let i=0;i<n;i++) burst(out, t0 + i*rnd(.01,.04), rnd(.004,.016), 'highpass', rnd(1200,3200), .7, rnd(.25,.75)); }}; },
  birds(out){ return {rate:.45, event:t0 => birdPhrase(out, t0, .06)}; },
  crickets(out){ return {rate:2.2, event:t0 => { const hi = Math.random() < .5, f = hi ? 4750 : 4300, pv = hi ? .5 : -.5; for (let i=0;i<4;i++) tone(out, t0+i*.032, f, f*1.01, .022, .035, pv); }}; }
};
function initAudio(){
  if (ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext; ctx = new AC();
  ['white','pink','brown'].forEach(k => NB[k] = buildNoise(k));
  master = gn(0); comp = ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3;
  analyser = ctx.createAnalyser(); analyser.fftSize = 1024; freqData = new Uint8Array(analyser.frequencyBinCount);
  chain(master, comp, analyser, ctx.destination);
  SOUNDS.forEach(s => { const g = gn(0); g.connect(master); const v = BUILD[s.id](g); v.gain = g; voices[s.id] = v; const l = state.levels[s.id]; g.gain.value = l*l; });
  touchBus = gn(.9); touchBus.connect(comp);
  touchGain = gn(0); touchFilter = filt('bandpass', 2000, .9); chain(src('white'), touchFilter, touchGain, touchBus);
}
function rampMaster(v, secs){ if (!ctx) return; const n = ctx.currentTime; master.gain.cancelScheduledValues(n); master.gain.setValueAtTime(master.gain.value, n); master.gain.linearRampToValueAtTime(v, n + secs); }
const masterLevel = () => state.dim ? .55 : .9;

/* ---------- breath / waves ---------- */
const ease = u => .5 - .5*Math.cos(Math.PI*Math.min(1, Math.max(0, u)));
function breathPhase(x){ const p = ((x - breathT0) % 10 + 10) % 10; return p < 4 ? {b:ease(p/4), inhale:true, left:4-p} : {b:1-ease((p-4)/6), inhale:false, left:10-p}; }
function computeWave(x){ return state.breath ? breathPhase(x).b : Math.pow(.5 - .5*Math.cos(2*Math.PI*x/9.5), 1.4); }

/* ---------- scheduler & timer ---------- */
let lastTick = performance.now(), fading = false, hintTimer = 0;
setInterval(() => {
  const now = performance.now(), dt = Math.min(.2, (now - lastTick)/1000); lastTick = now;
  const x = now/1000; waveB = computeWave(x);
  if (!ctx || !state.playing) return;
  const t0 = ctx.currentTime + .05;
  SOUNDS.forEach(s => {
    if (state.levels[s.id] < .01) return;
    const v = voices[s.id]; v.update && v.update(x);
    if (v.rate){ const e = v.rate*dt; let n = Math.floor(e) + (Math.random() < e % 1 ? 1 : 0); while (n--) v.event(t0 + Math.random()*dt); }
  });
  tickTimer(dt);
  hintTimer += dt; if (hintTimer > 18){ hintTimer = 0; rotateHint(); }
}, 50);
const clockEl = { set textContent(v){ if (state.started) $('#lensMain').textContent = v; } };
const fmt = s => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); };
function renderClock(){ clockEl.textContent = state.duration ? fmt(Math.ceil(state.remaining)) : fmt(state.elapsed); }
function resetTimer(){ state.remaining = state.duration; state.elapsed = 0; fading = false; renderClock(); }
function saveToday(){ LS.set(dayKey, todaySec); lastSave = todaySec; renderStat(); }
function tickTimer(dt){
  todaySec += dt; state.elapsed += dt;
  if (todaySec - lastSave > 5) saveToday();
  if (state.duration){
    state.remaining -= dt;
    if (state.remaining <= 8 && !fading){ fading = true; rampMaster(0, Math.max(.5, state.remaining)); }
    if (state.remaining <= 0){ endPractice(); return; }
  }
  renderClock();
}

/* ---------- levels, scenes, durations ---------- */
function setLevel(id, v){
  state.levels[id] = v; if (v > .01) state.last[id] = v;
  if (ctx) setP(voices[id].gain.gain, v*v, .4);
  updateCard(id); updateNow();
}
function applyMix(mix){ SOUNDS.forEach(s => setLevel(s.id, mix[s.id] || 0)); }
function setDuration(min){
  state.duration = min * 60;
  $$('#durChips button').forEach(b => b.setAttribute('aria-pressed', Number(b.dataset.min) === min));
  resetTimer();
  if (state.playing) rampMaster(masterLevel(), 1.2);
}
function setBreath(on){
  state.breath = on; breathT0 = performance.now()/1000;
  renderLens();
  if (on && state.levels.waves < .2) setLevel('waves', .6);
}
function setVoice(id){ state.voice = id; $$('#voiceChips button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === id)); }
function applyScene(id){
  const sc = SCENES.find(s => s.id === id); if (!sc) return;
  state.scene = id; state.dim = !!sc.dim;
  applyMix(sc.mix); setDuration(sc.min); setBreath(!!sc.breath);
  if (state.playing) rampMaster(masterLevel(), 1.2);
  renderRec(); setBg(id);
}

/* ---------- recommendation ---------- */
function timeScene(d){
  d = d || new Date(); const h = d.getHours() + d.getMinutes()/60, wk = d.getDay() === 0 || d.getDay() === 6;
  if (h >= 6 && h < 9) return (!wk && h >= 7) ? 'commute' : 'morning';
  if (h >= 9 && h < 11.5) return wk ? 'morning' : 'pause';
  if (h >= 11.5 && h < 14) return 'noon';
  if (h >= 14 && h < 17.5) return wk ? 'alone' : 'pause';
  if (h >= 17.5 && h < 19.5) return wk ? 'alone' : 'commute';
  if (h >= 19.5 && h < 22.5) return 'alone';
  if (h >= 22.5 || h < 1) return 'winddown';
  return 'night';
}
function renderRec(){ renderLens(); renderScenes(); }
function renderGreet(){}
function applyEmotion(pre){
  const e = EMOS.find(x => x.id === pre.emos[0]); if (!e) return;
  const h = new Date().getHours(), day = h >= 8 && h < 19;
  let sceneId = state.scene || state.rec;
  if (e.scene && (e.id !== 'tense' || day)) sceneId = e.scene;
  applyScene(sceneId);
  if (e.mix) applyMix(e.mix);
  if (e.breath) setBreath(true);
  if (e.voice) setVoice(e.voice);
  state.hintKey = 'm_' + e.id;
  if (e.id === 'afraid' || e.id === 'sleepless') state.dim = true;
  state.emoRec = e;
}

/* ---------- session flow ---------- */
const endcard = $('#endcard'), hint = $('#hint'), lens = $('#lens');
let wake = null;
async function requestWake(){ try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch(e){ wake = null; } }
function releaseWake(){ try { wake && wake.release(); } catch(e){} wake = null; }
function renderLens(){
  const sc = SCENES.find(s => s.id === state.scene) || SCENES[0];
  const top = $('#lensTop'), main = $('#lensMain'), sub = $('#lensSub'), cta = $('#lensCta');
  if (!state.started){
    top.textContent = state.scene === state.rec ? t('suggestedFor') : t('currentScene');
    main.className = 'lens-main'; main.textContent = L(sc.name);
    sub.textContent = L(REASON[sc.id]);
    cta.textContent = t('tapBegin');
  } else {
    main.className = 'lens-main time'; main.textContent = state.duration ? fmt(Math.ceil(state.remaining)) : fmt(state.elapsed);
    sub.textContent = SOUNDS.filter(s => state.levels[s.id] > .01).map(s => L(s.name)).join(' · ');
    cta.textContent = state.playing ? t('tapPause') : t('tapResume');
    if (!state.breath || !state.playing) top.textContent = state.playing ? t('listening') : t('paused');
  }
  $('#playbar').hidden = !state.started;
  $('#daily').hidden = state.started;
  lens.classList.toggle('breathing', state.started && state.breath);
  $('#breathTgl').setAttribute('aria-pressed', state.breath);
}
function renderOrbs(){ renderLens(); }
function play(){
  initAudio(); if (ctx.state !== 'running') ctx.resume();
  if (state.duration && state.remaining <= 0) resetTimer();
  if (!state.started){ state.started = true; state.elapsed = 0; }
  state.playing = true; fading = false; endcard.hidden = true;
  rampMaster(masterLevel(), 2.5); renderLens();
  showHint(state.hintKey); hintTimer = 0; requestWake();
}
function pause(){ state.playing = false; rampMaster(0, .8); renderLens(); releaseWake(); saveToday(); }
function endPractice(){
  if (!state.started) return;
  state.playing = false; state.started = false; fading = false;
  rampMaster(0, 1.2); releaseWake(); saveToday();
  hint.hidden = true; renderLens();
  state.sessionMin = Math.max(1, Math.round(state.elapsed/60));
  openPost();
}
lens.addEventListener('click', () => { if (!state.started) openPre(); else if (state.playing) pause(); else play(); });
$('#finishBtn').addEventListener('click', endPractice);
$('#breathTgl').addEventListener('click', () => { setBreath(!state.breath); renderLens(); });
document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body){ e.preventDefault(); lens.click(); } });
const HINT_CYCLE = ['hintStart','hintTouch','hintDrag','hintSit'];
function showHint(k){ hint.textContent = t(k); hint.hidden = false; hint.dataset.k = k; }
function rotateHint(){ if (!state.playing) return; const cur = hint.dataset.k; const base = state.hintKey && state.hintKey.startsWith('m_') ? [state.hintKey, ...HINT_CYCLE] : HINT_CYCLE; const pool = state.breath ? ['hintBreath', ...base] : base; showHint(pool[(pool.indexOf(cur) + 1) % pool.length]); }

/* ---------- weather icons ---------- */
const W_ICON = [
  '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>',
  '<circle cx="8" cy="8" r="3"/><path d="M8 2.5v1.2M2.5 8h1.2M4.1 4.1l.9.9M11.9 4.1l-.9.9"/><path d="M9 19h9a3.5 3.5 0 0 0 0-7 4.5 4.5 0 0 0-8.4-1.2A3.3 3.3 0 0 0 9 19z"/>',
  '<path d="M7 18h10a4 4 0 0 0 0-8 5 5 0 0 0-9.6-1.5A3.5 3.5 0 0 0 7 18z"/>',

];
const wLevel = v => v <= 1 ? 0 : v <= 3 ? 1 : v <= 5 ? 2 : v <= 7 ? 3 : 4;

/* ---------- quotes ---------- */
function quoteHTML(key, cls){
  const q = QUOTES[key]; if (!q) return '';
  const main = q.g ? q.zh : (lang === 'zh' ? q.zh : q.en), sub = q.g ? q.en : (lang === 'zh' ? q.en : q.zh);
  const cite = [L(q.by), L(q.src)].filter(Boolean).join(' · ');
  return `<div class="${cls || ''}"><p class="q-main">${esc(main)}</p><p class="q-sub">${esc(sub)}</p><p class="q-cite">— ${esc(cite)}</p></div>`;
}
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const dailyKey = DAILY[(new Date().getDate() + new Date().getMonth()) % DAILY.length];

/* ---------- pre check-in ---------- */
let pre = null, preStep = 0;
function openPre(){
  pre = {emos:[], score:5, moved:false, body:[]}; preStep = 0;
  $('#mPre').hidden = false; renderPre();
}
function closePre(){ $('#mPre').hidden = true; }
function dots(n, i){ return `<div class="dots" aria-hidden="true">${Array.from({length:n}, (_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div>`; }
function renderPre(){
  const body = $('#preBody'), foot = $('#preFoot');
  let h = dots(4, preStep), f = '';
  if (preStep === 0){
    h += `<h2 id="preTitle">${t('p1T')}</h2><p class="small">${t('p1S')}</p><div class="bubbles">` +
      EMOS.map(e => `<button type="button" class="bubble" data-emo="${e.id}" aria-pressed="${pre.emos.includes(e.id)}">${esc(L(EMO_LABEL[e.id]))}</button>`).join('') + `</div>`;
    if (pre.emos.length){ const e = EMOS.find(x => x.id === pre.emos[0]); h += `<div class="validate"><p><b>${t('v_' + e.id)}</b></p>${quoteHTML(e.q)}</div>`; }
    h += `<p class="warn" id="preWarn"></p>`;
    f = `<button type="button" class="link" data-act="cancel">${t('cancel')}</button><button type="button" class="primary" data-act="next">${t('next')}</button>`;

const sessions = () => LS.get('pn-sessions', []);
function finishSession(postData){

/* Anonymous stats: no device id, no timestamp, scores as bands only, body sensations never leave the device. */
const ENDPOINT = ''; // set to the analytics endpoint at launch; empty = prototype, nothing is sent
const band = v => v == null ? null : v <= 3 ? 'light' : v <= 6 ? 'medium' : 'heavy';
const dir = (a, b) => a == null || b == null ? null : a - b >= 1 ? 'better' : a - b <= -1 ? 'heavier' : 'same';
const partOfDay = h => h < 6 ? 'small_hours' : h < 9 ? 'morning' : h < 11 ? 'late_morning' : h < 14 ? 'midday' : h < 18 ? 'afternoon' : h < 22 ? 'evening' : 'night';
function queueAnon(r){
  if (LS.get('pn-consent', null) !== 'yes') return;
  const ev = {v:1, type:'session', lang, part_of_day: partOfDay(r.hour), day_type: r.wk ? 'weekend' : 'weekday', scene: r.scene,
    minutes: r.min <= 1 ? '1' : r.min <= 5 ? '2-5' : r.min <= 10 ? '6-10' : '10+', emotions: r.emos, pre_band: band(r.pre), change: dir(r.pre, r.post), helped: r.help};
  const box = LS.get('pn-outbox', []); box.push(ev); LS.set('pn-outbox', box.slice(-50)); flush();
}
function flush(){
  if (!ENDPOINT) return;
  const box = LS.get('pn-outbox', []); if (!box.length) return;
  fetch(ENDPOINT, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(box), credentials:'omit', referrerPolicy:'no-referrer'})
    .then(r => { if (r.ok) LS.set('pn-outbox', []); }).catch(() => {});
}

/* photos: each scene can carry a real landscape photo; user photos stay on this device (IndexedDB) */
const PHOTO = {};
const BUILTIN = {morning:'img/forest.jpg', commute:'img/jungle.jpg', pause:'img/stream.jpg', before:'img/sea.jpg', noon:'img/beach.jpg', alone:'img/campfire.jpg', winddown:'img/snow.jpg', night:'img/starry.jpg'};
const AI_IMG = new Set(['img/forest.jpg','img/stream.jpg','img/campfire.jpg','img/snow.jpg','img/starry.jpg','img/sea.jpg','img/jungle.jpg']);
const FOCUS = {'img/forest.jpg':'50% 40%','img/stream.jpg':'50% 55%','img/beach.jpg':'45% 85%','img/campfire.jpg':'50% 62%','img/snow.jpg':'50% 45%','img/starry.jpg':'50% 55%','img/sea.jpg':'50% 40%','img/jungle.jpg':'45% 55%'};
const TILE_BG = {
  morning:'linear-gradient(160deg,#F1C192,#7F9C94)', commute:'linear-gradient(160deg,#7E8F96,#34434A)', pause:'linear-gradient(160deg,#B7C6B6,#4E6E62)',
  before:'linear-gradient(160deg,#F2A877,#45506A)', noon:'linear-gradient(160deg,#E3C9A0,#5B7E82)', alone:'linear-gradient(160deg,#B07E62,#1C2733)',
  winddown:'linear-gradient(160deg,#5A5C70,#0A1216)', night:'linear-gradient(160deg,#4A5B5C,#060C0F)'
};
const photoUrl = id => PHOTO[id] || BUILTIN[id] || null;
const thumbStyle = id => { const u = photoUrl(id); return u ? `background-image:url(&quot;${u}&quot;)` : `background-image:${TILE_BG[id]}`; };
function idbOpen(){ return new Promise((res, rej) => { try { const r = indexedDB.open('pn-photos', 1); r.onupgradeneeded = () => r.result.createObjectStore('p'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch(e){ rej(e); } }); }
function idbDo(mode, fn){ return idbOpen().then(db => new Promise((res, rej) => { const tx = db.transaction('p', mode); const rq = fn(tx.objectStore('p')); tx.oncomplete = () => res(rq ? rq.result : undefined); tx.onerror = () => rej(tx.error); })); }
async function loadPhotos(){
  try { for (const s of SCENES){ const b = await idbDo('readonly', st => st.get(s.id)); if (b) PHOTO[s.id] = URL.createObjectURL(b); } } catch(e){}
  renderScenes(); setBg(state.scene);
}
function downscale(file){
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, 2000/Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); c.toBlob(b => b ? res(b) : rej(new Error('encode')), 'image/jpeg', .86); };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('decode')); };
    img.src = u;
  });
}
async function savePhoto(id, file){
  try {
    const blob = await downscale(file);
    try { await idbDo('readwrite', st => st.put(blob, id)); } catch(e){}
    if (PHOTO[id]) URL.revokeObjectURL(PHOTO[id]);
    PHOTO[id] = URL.createObjectURL(blob);
  } catch(e){}
  renderPhotos(); renderScenes(); if (state.scene === id) setBg(id);
}
async function resetPhoto(id){
  try { await idbDo('readwrite', st => st.delete(id)); } catch(e){}
  if (PHOTO[id]) URL.revokeObjectURL(PHOTO[id]); delete PHOTO[id];
  renderPhotos(); renderScenes(); if (state.scene === id) setBg(id);
}

  const t0 = ctx.currentTime + .01, hi = Math.min(.999, Math.max(0, 1 - yn)), pv = Math.max(-.8, Math.min(.8, xn*1.6 - .8));
  const idx = Math.floor(hi * 10), deg = idx % 5, oct = Math.floor(idx / 5), semis = PENTA[deg] + 12*oct;
  switch (state.voice){
    case 'drop':   { const f = 600 + hi*1400; tone(touchBus, t0, f*1.8, f, .12, .25, pv); burst(touchBus, t0, .03, 'bandpass', f*3, 3, .18); return null; }
    case 'pebble': { const f = 300 + hi*700; tone(touchBus, t0, f, f*1.9, .09, .3, pv); tone(touchBus, t0+.07, f*1.3, f*2.2, .07, .15, pv); return null; }
    case 'flake':  { const f = 659.25*Math.pow(2, semis/12); tone(touchBus, t0, f, f*.995, 1.6, .12, pv); tone(touchBus, t0, f*2.01, f*2, .9, .03, pv); return TONE[deg]; }
    case 'guzheng':{ const f = 220*Math.pow(2, semis/12); pluck(touchBus, t0, f, .55, pv); return TONE[deg]; }
    case 'bird':   birdPhrase(touchBus, t0, .14); return null;
  }
  return null;
}
const touch = $('#touch');
let drag = null;
const blocked = () => !endcard.hidden || !$('#mPre').hidden || !$('#mPost').hidden || !drawer.hidden;
function tapAt(cx, cy){
  initAudio(); if (ctx.state !== 'running') ctx.resume();

  P.ripple.push({x:cx, y:cy, r:4, life:1, label: note ? L(note) : ''});
}
touch.addEventListener('pointerdown', e => {
  if (blocked()) return;
  drag = {x:e.clientX, y:e.clientY, t:performance.now()};
  try { touch.setPointerCapture(e.pointerId); } catch(_){}
  tapAt(e.clientX, e.clientY);
});
touch.addEventListener('pointermove', e => {
  if (!drag || !ctx) return;
  const now = performance.now(), dist = Math.hypot(e.clientX-drag.x, e.clientY-drag.y), speed = dist / Math.max(1, now-drag.t);
  setP(touchGain.gain, Math.min(.45, speed*.35), .04); setP(touchFilter.frequency, 500 + (1 - e.clientY/H)*4500, .05);
  P.trail.push({x:e.clientX, y:e.clientY, life:1}); drag = {x:e.clientX, y:e.clientY, t:now};
});

touch.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !blocked()){ e.preventDefault(); tapAt(W/2, H*.7); } });

/* ---------- canvas ---------- */
const cv = $('#field'), g = cv.getContext('2d'); let W = 0, H = 0;
let trees = [], fogs = [];
const PART = '#FFF6EA', EMBER = '#FFB070', LEAF = '#DCE6AA', GLOW = '#FFE9A8';
function seedLand(){
  trees = [2, 3].map(layer => { const arr = []; let x = -10; const sc = (layer === 3 ? 1.35 : 1)*Math.min(1.4, H/800 + .45);
    while (x < W + 20){ arr.push({x, h: rnd(16, 40)*sc, w: rnd(.4, .58)}); x += rnd(6, 15)*sc; } return arr; });
  fogs = Array.from({length: 7}, () => ({x: rnd(0, W), y: H*rnd(.4, .85), r: rnd(.22, .45)*Math.max(W, H), v: rnd(.05, .16)*(Math.random() < .5 ? -1 : 1)}));
}
function resize(){ const dpr = Math.min(1.5, window.devicePixelRatio || 1); W = window.innerWidth; H = window.innerHeight; cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); g.setTransform(dpr,0,0,dpr,0,0); seedLand(); }
addEventListener('resize', resize);
const SKY = {
  dawn:  {s:['#56708A','#B79A93','#F1C192'], ink:'#2B403F', sun:'#FFD7A0', moon:false},
  day:   {s:['#5B7E82','#9DB2A7','#E3C9A0'], ink:'#2D463F', sun:'#FFE4B5', moon:false},
  dusk:  {s:['#45506A','#A57F86','#F2A877'], ink:'#2C3240', sun:'#FFC48A', moon:false},
  eve:   {s:['#1C2733','#3D4152','#8E6A64'], ink:'#10181E', sun:'#E9B48C', moon:true},
  night: {s:['#0A1216','#12212A','#2B3B3C'], ink:'#060C0F', sun:'#BFD0D6', moon:true}
};
function skyBand(){ const d = new Date(), h = d.getHours() + d.getMinutes()/60; return h >= 5 && h < 9 ? 'dawn' : h >= 9 && h < 16 ? 'day' : h >= 16 && h < 19.5 ? 'dusk' : h >= 19.5 && h < 23 ? 'eve' : 'night'; }
let skyB = skyBand(); setInterval(() => { skyB = skyBand(); }, 60000);
const hx = c => [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
const mixc = (a, b, k) => { const A = hx(a), B = hx(b); return '#' + A.map((v,i) => Math.round(v + (B[i]-v)*k).toString(16).padStart(2,'0')).join(''); };
const land = {sea:0, snow:0};
const ridgeY = (i, x) => { const base = H*(.52 + i*.085), amp = H*(.05 + i*.02); return base - (Math.sin(x*.0032 + i*1.7)*.6 + Math.sin(x*.0091 + i*.6)*.3 + Math.sin(x*.021 + i)*.1 + .4)*amp; };
const P = {rain:[], snow:[], leaf:[], ember:[], fly:[], bird:[], flow:[], ripple:[], trail:[], party:[]};
const lv = id => state.levels[id] || 0;
const cnt = r => { const f = Math.floor(r); return f + (Math.random() < r - f ? 1 : 0); };
function step(arr, fn){ for (let i = arr.length-1; i >= 0; i--) if (fn(arr[i]) === false) arr.splice(i, 1); }
function celebrate(){ const n = reduce ? 12 : 44; for (let i = 0; i < n; i++) P.party.push({x:rnd(0,W), y:H*rnd(.5,1), vx:rnd(-.3,.3), vy:rnd(-1.2,-.4), ph:rnd(0,6), life:1}); }
function frame(){
  const tm = performance.now()/1000; waveB = computeWave(tm);
  const br = state.breath ? waveB : .5 - .5*Math.cos(2*Math.PI*tm/10);

    const k = reduce ? .35 : 1, wind = .3 + lv('wind')*2.4, S = SKY[skyB], hz = H*.56;

    land.snow += ((lv('snow') > .3 && lv('waves') <= .25 ? 1 : 0) - land.snow)*.02;
    const fa = 1 - land.sea;

    if (!state.photo){
    g.globalAlpha = 1;
    let gr = g.createLinearGradient(0, 0, 0, hz); gr.addColorStop(0, S.s[0]); gr.addColorStop(.62, S.s[1]); gr.addColorStop(1, S.s[2]);
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    const sx = W*.7, sy = hz - H*.06;
    const rg = g.createRadialGradient(sx, sy, 0, sx, sy, Math.max(W, H)*.55); rg.addColorStop(0, S.sun); rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.globalAlpha = (S.moon ? .16 : .4)*(.82 + .18*br); g.fillStyle = rg; g.fillRect(0, 0, W, H);
    g.globalAlpha = S.moon ? .9 : .6; g.fillStyle = S.moon ? '#F4EEDF' : '#FFF1D6';
    g.beginPath(); g.arc(sx, S.moon ? hz - H*.32 : sy, S.moon ? 13 : 28, 0, 6.283); g.fill();
    if (fa > .01){
      for (let i = 0; i < 4; i++){
        let col = mixc(S.s[2], S.ink, .3 + i*.22);
        if (land.snow > .01 && i < 3) col = mixc(col, '#E6ECEE', land.snow*(.6 - i*.16));
        g.globalAlpha = fa; g.fillStyle = col; g.beginPath(); g.moveTo(0, H);
        for (let x = 0; x <= W + 8; x += 8) g.lineTo(x, ridgeY(i, x));
        g.lineTo(W, H); g.closePath(); g.fill();
        if (i >= 2){
          g.globalAlpha = fa*(1 - land.snow*.6);
          g.beginPath();
          trees[i-2].forEach(tr => { const y = ridgeY(i, tr.x) + 3; g.moveTo(tr.x, y - tr.h); g.lineTo(tr.x - tr.h*tr.w*.5, y); g.lineTo(tr.x + tr.h*tr.w*.5, y); g.closePath(); });
          g.fill();
        }
        if (i < 3){
          const y0 = H*(.52 + i*.085) - H*.05, y1 = y0 + H*.14;
          const fg = g.createLinearGradient(0, y0, 0, y1); const a = (.16 + .1*br)*fa;
          fg.addColorStop(0, 'rgba(255,248,236,0)'); fg.addColorStop(.55, `rgba(255,248,236,${a})`); fg.addColorStop(1, 'rgba(255,248,236,0)');

        }
      }
    }
    if (land.sea > .01){

      const sg = g.createLinearGradient(0, hz, 0, H); sg.addColorStop(0, S.s[2]); sg.addColorStop(.35, mixc(S.s[2], S.ink, .45)); sg.addColorStop(1, mixc(S.s[2], S.ink, .8));

      g.strokeStyle = S.sun; g.lineWidth = 1.4;

        const f = j/26, y = hz + 3 + Math.pow(f, 1.6)*(H - hz)*.8, w = (8 + f*120)*(.55 + .45*Math.sin(tm*1.3 + j*1.7));

        for (let x = 0; x <= W + 10; x += 10) pts.push([x, base + Math.sin(x*.009 + tm*(.5 + j*.15) + j*2)*(4 + 7*waveB) + Math.sin(x*.023 - tm*.8)*2]);
        g.beginPath(); g.moveTo(0, H); pts.forEach(q => g.lineTo(q[0], q[1])); g.lineTo(W, H); g.closePath();

    }
    fogs.forEach(f => { f.x += f.v; if (f.x < -f.r) f.x = W + f.r; if (f.x > W + f.r) f.x = -f.r;
      const fg = g.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r); fg.addColorStop(0, 'rgba(255,248,236,1)'); fg.addColorStop(1, 'rgba(255,248,236,0)');
      g.globalAlpha = (state.photo ? .03 : .06) + (state.photo ? .03 : .06)*br; g.fillStyle = fg; g.fillRect(f.x - f.r, f.y - f.r, f.r*2, f.r*2); });
    if (lv('fire') > .01){ const eg = g.createRadialGradient(W/2, H, 0, W/2, H, H*.6); eg.addColorStop(0, EMBER); eg.addColorStop(1, 'rgba(0,0,0,0)'); g.globalAlpha = .3*lv('fire')*(.85 + .15*Math.sin(tm*7)*Math.sin(tm*3.1)); g.fillStyle = eg; g.fillRect(0, 0, W, H); }
    if (fa > .3 && !state.photo){
      for (let n = cnt(lv('stream')*.6*k); n-- && P.flow.length < 80;) P.flow.push({x:-80, y:H*rnd(.86,.96), len:rnd(20,80), v:rnd(1.6,3.8)});
      g.strokeStyle = PART; g.lineWidth = 1.2; g.globalAlpha = (.2 + .3*lv('stream'))*fa; g.beginPath();
      step(P.flow, p => { p.x += p.v; const y = p.y + Math.sin(tm*2 + p.x*.02)*1.5; g.moveTo(p.x, y); g.lineTo(p.x + p.len, y); return p.x < W + 10; }); g.stroke();
    }
    for (let n = cnt(lv('rain')*3.5*k); n-- && P.rain.length < 260;) P.rain.push({x:rnd(-60, W+20), y:-20, v:rnd(9,15), l:rnd(10,24)});
    g.strokeStyle = PART; g.lineWidth = 1; g.globalAlpha = .38; g.beginPath();
    step(P.rain, p => { p.y += p.v; p.x += wind*.7; g.moveTo(p.x, p.y); g.lineTo(p.x - wind*1.4, p.y - p.l); return p.y < H; }); g.stroke();
    for (let n = cnt(lv('snow')*.8*k); n-- && P.snow.length < 240;) P.snow.push({x:rnd(-W*.1, W*1.05), y:-6, r:rnd(.8,3), v:rnd(.35,1.05), ph:rnd(0,6)});
    g.fillStyle = PART; g.globalAlpha = .85;
    step(P.snow, p => { p.y += p.v; p.x += wind*.35 + Math.sin(tm*.8 + p.ph)*.35; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 6.283); g.fill(); return p.y < H + 6; });
    for (let n = cnt((lv('leaves')*.18 + lv('wind')*.04)*k); n-- && P.leaf.length < 60;) P.leaf.push({x:-20, y:rnd(0, H*.7), s:rnd(3,6), rot:rnd(0,6), vr:rnd(-.04,.04), ph:rnd(0,6)});
    g.fillStyle = LEAF; g.globalAlpha = .8;
    step(P.leaf, p => { p.x += wind*1.4 + .6; p.y += .4 + Math.sin(tm*1.5 + p.ph)*.6; p.rot += p.vr; g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.beginPath(); g.ellipse(0, 0, p.s*1.8, p.s*.8, 0, 0, 6.283); g.fill(); g.restore(); return p.x < W + 30 && p.y < H + 10; });
    for (let n = cnt(lv('fire')*.5*k); n-- && P.ember.length < 80;) P.ember.push({x:W/2 + rnd(-.18,.18)*W, y:H + 4, v:rnd(.5,1.6), ph:rnd(0,6), life:1});

    step(P.ember, p => { p.y -= p.v; p.x += Math.sin(tm*2.5 + p.ph)*.6 + wind*.2; p.life -= .005; g.globalAlpha = Math.max(0, p.life)*.9; g.beginPath(); g.arc(p.x, p.y, 1.7, 0, 6.283); g.fill(); return p.life > 0; });

    for (let n = cnt(lv('birds')*.005); n-- && P.bird.length < 6;) P.bird.push({x:-20, y:H*rnd(.14,.34), v:rnd(1.2,2.4), fl:rnd(0,6), s:rnd(.8,1.4)});
    g.strokeStyle = S.moon ? PART : '#3A3A3A'; g.lineWidth = 1.5; g.globalAlpha = .7;

    let vg = g.createLinearGradient(0, 0, 0, H); vg.addColorStop(0, 'rgba(8,12,10,.22)'); vg.addColorStop(.25, 'rgba(8,12,10,0)'); vg.addColorStop(.62, 'rgba(8,12,10,0)'); vg.addColorStop(1, 'rgba(8,12,10,.42)');
    if (!state.photo){ g.globalAlpha = 1; g.fillStyle = vg; g.fillRect(0, 0, W, H); }
    g.strokeStyle = PART; g.lineWidth = 1.5; g.font = '16px "Noto Serif SC", serif'; g.textAlign = 'center';
    step(P.ripple, p => { p.r += 1.8; p.life -= .016; g.globalAlpha = Math.max(0, p.life); g.beginPath(); g.arc(p.x, p.y, p.r, 0, 6.283); g.stroke(); if (p.label){ g.fillStyle = PART; g.fillText(p.label, p.x, p.y - 12 - (1 - p.life)*18); } return p.life > 0; });
